name: Weekly forecast refresh

# Every Monday at 11:00 UTC (6 AM Eastern), plus a manual "Run workflow" button.
on:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Run pipeline
        # The weekly run uses the fixed demo snapshot date so results stay reproducible.
        # To simulate a live weekly refresh, use: python -m src.pipeline --as-of $(date +%F)
        run: python -m src.pipeline

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: forecast-outputs
          path: |
            outputs/*.json
            outputs/*.md
            outputs/forecast_open_sailings.csv
            outputs/figures/
            logs/pipeline.log
          retention-days: 30
